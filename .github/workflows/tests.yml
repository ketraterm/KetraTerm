name: Test Suite

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            shells: BASH,ZSH,FISH,POWERSHELL
          - os: macos-15
            shells: BASH,ZSH,FISH,POWERSHELL
          - os: windows-2025
            shells: WINDOWS_POWERSHELL,POWERSHELL,GIT_BASH
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JBR 25
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '25'

      - name: Setup Gradle
        id: setup_gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node for process tests and release automation
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Release Automation
        if: runner.os == 'Linux'
        run: node --test .github/scripts/release.test.mjs

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zsh fish fonts-dejavu-core

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash zsh fish
          for formula in bash zsh fish; do
            echo "$(brew --prefix "$formula")/bin" >> "$GITHUB_PATH"
          done

      - name: Run JVM, Native, and Desktop Suites (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a ./gradlew test nativeTest desktopTest --continue "-Dterminal.test.requiredShells=${{ matrix.shells }}"

      - name: Run JVM, Native, and Desktop Suites (Windows & macOS)
        if: runner.os != 'Linux'
        run: |
          ./gradlew test nativeTest desktopTest --continue "-Dterminal.test.requiredShells=${{ matrix.shells }}"

      - name: Test Published Consumers
        if: ${{ !cancelled() && steps.setup_gradle.outcome == 'success' }}
        run: ./gradlew :ketraterm-testkit:publishedConsumerTest --continue

      - name: Run IntelliJ Plugin Tests (Linux)
        if: runner.os == 'Linux'
        working-directory: ketraterm-intellij-plugin
        run: |
          xvfb-run -a ./gradlew test "-Djava.awt.headless=true"

      - name: Compile Benchmark Harnesses
        run: ./gradlew :ketraterm-benchmarks:jmhJar

      - name: Check Published Library ABI and Native Version
        run: ./gradlew checkKotlinAbi :ketraterm-app:writeNativeVersion

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          overwrite: true
          retention-days: 14
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/test-artifacts/
