name: Test Suite

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JBR 25
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node for release automation tests
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Release Automation
        if: runner.os == 'Linux'
        run: node --test .github/scripts/release.test.mjs

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zsh fish

      - name: Run Tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run ./gradlew test :ketraterm-testkit:publishedConsumerTest --continue "-Djava.awt.headless=true"

      - name: Run Tests (Windows & macOS)
        if: runner.os != 'Linux'
        run: |
          ./gradlew test :ketraterm-testkit:publishedConsumerTest --continue "-Djava.awt.headless=true"

      - name: Run IntelliJ Plugin Tests (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run ./gradlew -p ketraterm-intellij-plugin test "-Djava.awt.headless=true"

      - name: Compile Benchmark Harnesses
        run: ./gradlew :ketraterm-benchmarks:jmhJar

      - name: Check Published Library ABI
        run: ./gradlew checkKotlinAbi

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/build/reports/tests/'
