name: Publish website and documentation

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]
  workflow_run:
    workflows: ['Publish Binaries']
    types: [completed]

permissions:
  contents: read

# Serialize archive updates with deployment. Never cancel an active archive write.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read documentation archive
        shell: bash
        run: |
          # Exit 2 means the branch is absent. Authentication/network failures must
          # stop publication rather than silently discard the existing archive.
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --no-tags origin gh-pages
            git worktree add --detach .site-archive FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach .site-archive HEAD
            git -C .site-archive checkout --orphan gh-pages
            git -C .site-archive rm -rf .
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: npm test && npm run format:check
        working-directory: website

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backfill missing release APIs
        run: npm run backfill:api
        working-directory: website
        env:
          WEBSITE_ARCHIVE: ${{ github.workspace }}/.site-archive
      - name: Select documentation channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "RELEASE=true" >> "$GITHUB_ENV"
            echo "WEBSITE_RELEASE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE=false" >> "$GITHUB_ENV"
          fi
      - run: ./gradlew :dokkaGenerate --no-daemon
        if: env.RELEASE != 'true'

      - uses: actions/configure-pages@v5
        id: pages
      - name: Build website and retain documentation versions
        run: npm run build && npm run check:links
        working-directory: website
        env:
          WEBSITE_ARCHIVE: ${{ github.workspace }}/build/website-history
          WEBSITE_SOURCE_REF: ${{ github.sha }}
          WEBSITE_REQUIRE_API: 'true'
          WEBSITE_URL: ${{ steps.pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Persist archive
        shell: bash
        run: |
          rsync -a --delete --exclude=.git build/website/ .site-archive/
          git -C .site-archive config user.name 'github-actions[bot]'
          git -C .site-archive config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .site-archive add --all
          if ! git -C .site-archive diff --cached --quiet; then
            git -C .site-archive commit -m "Publish documentation for $GITHUB_SHA"
          fi
          git -C .site-archive push origin HEAD:gh-pages

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
