name: Check website

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: check-website-${{ github.workflow }}-${{ inputs.revision || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website
      - run: npm test && npm run format:check && npm run build && npm run check:links
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
