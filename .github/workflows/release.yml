name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release from VERSION
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      needed: ${{ steps.prepare.outputs.needed }}
      revision: ${{ steps.commit.outputs.revision }}
      tag: ${{ steps.prepare.outputs.tag }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    env:
      RELEASE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read all published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Prepare versioned changelogs
        id: prepare
        run: node .github/scripts/release.mjs prepare "$RUNNER_TEMP/releases.json"
      - name: Check release bot credentials
        if: steps.prepare.outputs.needed == 'true' && steps.prepare.outputs.existing_tag != 'true'
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$RELEASE_APP_CLIENT_ID" || -z "$RELEASE_APP_PRIVATE_KEY" ]]; then
            echo '::error::Configure the RELEASE_APP_CLIENT_ID Actions variable and RELEASE_APP_PRIVATE_KEY Actions secret for the release bot. See docs/development/releases.md.'
            exit 1
          fi
      - name: Authenticate release bot
        if: steps.prepare.outputs.needed == 'true' && steps.prepare.outputs.existing_tag != 'true'
        id: release-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Setup JBR 25
        if: steps.prepare.outputs.needed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.prepare.outputs.needed == 'true'
      - name: Install system dependencies
        if: steps.prepare.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zsh fish
      - name: Verify release before creating tag
        if: steps.prepare.outputs.needed == 'true'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          node --test .github/scripts/release.test.mjs
          xvfb-run -a ./gradlew spotlessCheck checkKotlinAbi test publicationChecks :ketraterm-app:writeNativeVersion --no-daemon
      - name: Upload failed release verification reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-reports
          overwrite: true
          path: |
            **/build/reports/tests/
            build/reports/configuration-cache/
            build/reports/problems/
      - name: Commit changelogs and create tag atomically
        if: steps.prepare.outputs.needed == 'true'
        id: commit
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
          EXISTING_TAG: ${{ steps.prepare.outputs.existing_tag }}
          RELEASE_PUSH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          if [[ "$EXISTING_TAG" != true ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add VERSION CHANGELOG.md ketraterm-app/CHANGELOG.md ketraterm-intellij-plugin/CHANGELOG.md
            if ! git diff --cached --quiet; then
              git commit -m "Release $TAG"
            fi
            git tag "$TAG"
            auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w 0)"
            echo "::add-mask::$auth_header"
            git -c "http.$GITHUB_SERVER_URL/.extraheader=$auth_header" push --atomic origin HEAD:refs/heads/master "refs/tags/$TAG"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify exact release revision
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      full: true
    secrets: inherit

  maven:
    needs: [prepare, verify]
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
    secrets: inherit

  binaries:
    needs: [prepare, maven]
    if: needs.prepare.outputs.needed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-binaries.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      tag: ${{ needs.prepare.outputs.tag }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
    secrets: inherit
